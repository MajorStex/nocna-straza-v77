name: V148 real New Zone 2-player WebSocket smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v148-new-zone-live-e2e.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-two-player:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One actual 2-player session, shared goblins and mobile reconnection
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const endpoint='https://nocna-straza-relay.stefanstevic1996.workers.dev';
          const health=await (await fetch(endpoint+'/health')).json();
          assert.equal(health.arenaBuild,148,'must exercise deployed V148 server');
          assert.equal(health.arenaMobs,12);
          const res=await fetch(endpoint+'/arena/create',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({code:'TSTABC',seats:['p1','p2']})
          });
          const data=await res.json();
          assert.equal(res.status,200,'new arena should not block friends with free_test_budget_reached: '+JSON.stringify(data));
          assert.equal(data.protocol,140);
          const peers=[];
          const connect=(id)=>{
            const ws=new WebSocket(data.ws);
            const peer={id,ws,messages:[],snapshots:[],opened:false,closed:false};
            ws.addEventListener('open',()=>{peer.opened=true;ws.send(JSON.stringify({t:'hello',id,ticket:data.tickets[id],protocol:140}))});
            ws.addEventListener('message',e=>{
              const m=JSON.parse(e.data);peer.messages.push(m);
              if(m.t==='s')peer.snapshots.push(m);
              if(peer.messages.length>100)peer.messages.shift();
              if(peer.snapshots.length>100)peer.snapshots.shift();
            });
            ws.addEventListener('close',()=>peer.closed=true);
            ws.addEventListener('error',e=>console.log('WS error',id,String(e.message||e)));
            peers.push(peer);return peer;
          };
          const until=async(fn,name,ms=15000)=>{
            const start=Date.now();
            while(Date.now()-start<ms){if(fn())return;await new Promise(r=>setTimeout(r,60))}
            throw Error('Timed out: '+name);
          };
          try{
            const p1=connect('p1'),p2=connect('p2');
            await until(()=>[p1,p2].every(p=>p.messages.some(x=>x.t==='start')),'both players start');
            console.log('REAL_NEW_ZONE: two players received START');
            let seq=0;const input=setInterval(()=>{
              if(p1.ws.readyState===WebSocket.OPEN)p1.ws.send(JSON.stringify({t:'i',seq:++seq,ax:0,ay:0,attack:1}));
            },50);
            try{
              await until(()=>p1.snapshots.some(m=>m.mobs?.length===12&&m.ack>0),'goblins and input ACK');
              await until(()=>p1.snapshots.some(m=>m.mobs?.some(g=>g[3]<35)),'server hit on goblins');
            }finally{clearInterval(input)}
            console.log('REAL_NEW_ZONE: 12 shared goblins, attack damage and ACK verified');
            p2.ws.close(1000,'Android background simulation');
            await until(()=>p2.closed,'p2 disconnect');
            const resumed=connect('p2');
            await until(()=>resumed.messages.some(m=>m.t==='start'&&m.rejoined===true),'same seat resumes match');
            console.log('REAL_NEW_ZONE: Android same-seat rejoin verified');
            p1.ws.send(JSON.stringify({t:'end'}));
          }finally{
            for(const p of peers)try{p.ws.close()}catch{}
          }
          console.log('V148 REAL 2-PLAYER WEBSOCKET TEST PASS');
          JS
