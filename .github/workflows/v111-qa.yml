name: V111 multiplayer performance and regressions
on:
  push:
    branches: [main]
    paths:
      - 'public/v111/**'
      - 'public/v111-village.js'
      - 'tests/v111-*.test.cjs'
      - '.github/workflows/v111-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install headless browser test drivers
        run: npm install --no-save --no-package-lock playwright-core@1.58.2 ws@8
      - name: Village and mobile compatibility
        run: node tests/v111-village.test.cjs
      - name: Two players start, rematch, leave and rejoin
        run: node tests/v111-relay-e2e.test.cjs
      - name: Six players, jitter, packet loss, rematch and rejoin
        run: node tests/v111-six-players.test.cjs
