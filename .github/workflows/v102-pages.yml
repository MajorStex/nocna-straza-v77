name: Publish Noćna Straža to GitHub Pages (when enabled)
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/v102-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nocna-straza-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sSL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = 200 ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "GitHub Pages not enabled. Open Settings > Pages > Source: GitHub Actions, then rerun this workflow."
          fi
      - name: Configure Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload V102 game
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Publish V102 game
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
        id: publish
