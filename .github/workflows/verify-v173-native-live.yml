name: Verify V173 exact live Ability Forge
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-v173-native-live.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Compare exact production assets on permanent Worker
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const base='https://nocna-straza-v77.stefanstevic1996.workers.dev';
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const files={'index.html':'/','v171-character-creator.js':'/v171-character-creator.js?v=173','v172-character-voices.js':'/v172-character-voices.js?v=173','v173-ability-forge.js':'/v173-ability-forge.js?v=173','v115-village.js':'/v115-village.js?v=166&ui=170','v165-classic-voice.js':'/v165-classic-voice.js?v=166&ui=169','v140-net-mode.js':'/v140-net-mode.js?v=168'};
          for(let i=0;i<9;i++){
           const results=await Promise.all(Object.entries(files).map(async ([name,path])=>{
            try{
             const u=new URL(base+path);u.searchParams.set('verify',process.env.GITHUB_RUN_ID+'-'+i);
             const r=await fetch(u,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
             const bytes=Buffer.from(await r.arrayBuffer()),hash=digest(bytes),expected=digest(fs.readFileSync('public/'+name));
             console.log(name,r.status,'match',hash===expected,'sha256',hash,'release',name==='index.html'?bytes.toString().match(/<meta name="ns-release" content="(\d+)"/)?.[1]:'');
             return r.ok&&hash===expected;
            }catch(e){console.error(name,String(e));return false}
           }));
           if(results.every(Boolean)){console.log('PRODUCTION EXACT V173: true');process.exit(0)}
           await new Promise(r=>setTimeout(r,6500));
          }
          console.log('PRODUCTION EXACT V173: false');process.exitCode=1;
          JS
