name: V113 rescued ally and multiplayer regressions
on:
  push:
    branches: [main]
    paths:
      - 'public/v113/**'
      - 'public/v111-village.js'
      - 'tests/v113-*.test.cjs'
      - '.github/workflows/v113-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ally:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/v113-ally.test.cjs
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2 ws@8
      - run: node tests/v113-village.test.cjs
      - run: node tests/v113-relay-e2e.test.cjs
      - run: node tests/v113-six-players.test.cjs
