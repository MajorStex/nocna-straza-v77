name: Verify permanent Cloudflare Worker Git integration (no token)
on:
  push:
    branches: [main]
    paths:
      - 'public/v165-classic-voice.js'
      - 'scripts/verify-live-cloudflare-git-sync.mjs'
      - '.github/workflows/verify-live-cloudflare-git-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check permanent game URL against exact GitHub asset SHA-256
        run: node scripts/verify-live-cloudflare-git-sync.mjs
