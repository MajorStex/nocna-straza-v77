name: Live Noćna Straža v99 – Team Votes and Level Freeze
on:
  push:
    branches: [main]
    paths:
      - "tests/v99-live-coop.test.cjs"
      - ".github/workflows/v99-live-coop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-coop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Two Android-size Chromium peers over real Cloudflare relay
        run: NS99_USE_LOCAL=1 node tests/v99-live-coop.test.cjs
