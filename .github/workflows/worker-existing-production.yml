name: Noćna Straža - deploy EXISTING workers.dev game
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/current-deployment.test.cjs'
      - 'tests/v140-isolated-arena.test.cjs'
      - '.github/workflows/worker-existing-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocna-straza-v77-worker-production
  cancel-in-progress: false
jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_URL: https://nocna-straza-v77.stefanstevic1996.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate main game release and saved mobile shortcut
        run: node tests/current-deployment.test.cjs
      - name: Test isolated V140 mode if present in this release
        shell: bash
        run: |
          if [ -f tests/v140-isolated-arena.test.cjs ]; then
            node tests/v140-isolated-arena.test.cjs
          else
            echo "V140 not in main release yet: leaving existing game untouched"
          fi
      - name: Require Cloudflare Worker credentials (do not silently skip deployment)
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Worker NOT deployed::Set repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID with Workers Scripts Edit permissions. Existing workers.dev link was NOT updated."
            exit 1
          fi
      - name: Block stale commits and version downgrades
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error title=Outdated release rejected::A newer main commit exists. No deployment."
            exit 1
          fi
          python3 - <<'PY'
          import os,re,urllib.request
          from pathlib import Path
          candidate=Path('public/index.html').read_text(encoding='utf-8')
          m=re.search(r'<title>Night Watch v(\d+)\b',candidate)
          if not m: raise SystemExit('ERROR: missing candidate version')
          expected=int(m.group(1))
          url=os.environ['LIVE_URL']+'?version-preflight='+os.environ['GITHUB_SHA']
          try:
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NocturnaWorkerRelease/1.0'})
            with urllib.request.urlopen(req,timeout=25) as response:
              live=response.read(2_000_000).decode('utf-8','replace')
          except Exception as error:
            raise SystemExit('ERROR: current worker could not be checked, refusing unsafe deploy: '+str(error))
          found=[int(x) for x in re.findall(r'Night Watch v(\d+)|VERZIJA V(\d+)',live) for x in x if x]
          if not found: raise SystemExit('ERROR: no version in existing Worker; refusing unsafe deploy')
          actual=max(found)
          print(f'Existing Worker v{actual}; candidate v{expected}')
          if expected<actual: raise SystemExit('ERROR: refusing Worker version downgrade')
          PY
      - name: Deploy static game to SAME Cloudflare Worker
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify actual live Worker version
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,time
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          expected=int(re.search(r'<title>Night Watch v(\d+)\b',html).group(1))
          base=os.environ['LIVE_URL']
          for attempt in range(1,9):
            try:
              u=base+'?worker-deploy='+os.environ['GITHUB_SHA']+'-'+str(attempt)
              req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'NocturnaWorkerRelease/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(2_000_000).decode('utf-8','replace')
              m=re.search(r'<title>Night Watch v(\d+)\b',data)
              if m and int(m.group(1))==expected:
                print(f'Verified existing workers.dev URL serves V{expected}')
                with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f'### Worker LIVE: V{expected}\n\n{base}\n')
                break
              print('Attempt',attempt,'not updated yet')
            except Exception as ex:
              print('Attempt',attempt,'error:',ex)
            time.sleep(5)
          else:
            raise SystemExit('ERROR: Worker production version mismatch; deployment NOT verified')
          PY
