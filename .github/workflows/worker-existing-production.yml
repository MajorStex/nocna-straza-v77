name: Noćna Straža - deploy EXISTING workers.dev game
# V142 redeploy requested; existing Worker name and version guard remain unchanged.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'tests/current-deployment.test.cjs'
      - 'tests/v140-isolated-arena.test.cjs'
      - 'tests/v159-voice.test.cjs'
      - 'tests/v161-voice-badges.test.cjs'
      - 'tests/v160-sandbox.test.cjs'
      - 'tests/v162-boss-palette.test.cjs'
      - 'tests/v163-push-to-talk.test.cjs'
      - 'tests/v164-level0-access.test.cjs'
      - 'tests/v166-classic-sync.test.cjs'
      - 'tests/v159-voice.test.cjs'
      - 'tests/v161-voice-badges.test.cjs'
      - 'tests/v163-push-to-talk.test.cjs'
      - 'tests/v166-lobby-mobile-width.test.cjs'
      - 'tests/v166-lobby-mobile-browser.test.cjs'
      - 'public/v165-classic-voice.js'
      - 'scripts/verify-live-v169-village.mjs'
      - 'tests/v138-village-pvp-animals.test.cjs'
      - 'tests/v169-village-mobile-hud.test.cjs'
      - '.github/workflows/worker-existing-production.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: nocna-straza-v77-worker-production
  cancel-in-progress: false
jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_URL: https://nocna-straza-v77.stefanstevic1996.workers.dev/
    steps:
      - name: Report production deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: 'pending',
              context: 'cloudflare/worker-production',
              description: 'Validating and deploying the existing game Worker',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require up-to-date development handoff before each release
        run: node tests/v199-development-log.test.cjs
      - name: Validate main game release and saved mobile shortcut
        run: node tests/current-deployment.test.cjs
      - name: Test isolated V140 mode if present in this release
        shell: bash
        run: |
          if [ -f tests/v140-isolated-arena.test.cjs ]; then
            node tests/v140-isolated-arena.test.cjs
          else
            echo "V140 not in main release yet: leaving existing game untouched"
          fi
      - name: V159 microphone isolation and version regression checks
        run: node tests/v159-voice.test.cjs
      - name: V161 microphone-toggle, speaking badge and isolated voice test
        run: node tests/v161-voice-badges.test.cjs
      - name: V160 sandbox safe-release checks (no browser required)
        run: NO_BROWSER=1 node tests/v160-sandbox.test.cjs
      - name: V163 Push-to-Talk, Android touch release and microphone privacy tests
        run: node tests/v163-push-to-talk.test.cjs
      - name: V162 native boss and compact live sandbox (safe release)
        run: NO_BROWSER=1 node tests/v162-boss-palette.test.cjs
      - name: V164 verify New Zone unlocked for level 0 SOLO, co-op, READY and auto-start
        run: node tests/v164-level0-access.test.cjs
      - name: V166 protect original classic art, lobby and new voice compatibility
        run: node tests/v166-classic-sync.test.cjs
      - name: V237 exact shared guard audio and state transitions
        run: node tests/v237-guard-voice.test.cjs
      - name: V238 cave goblin guard SOLO and identical sentry AI tests
        run: node tests/v238-cage-guards.test.cjs
      - name: V240 stone well art and finite Old Forge pause client regression
        run: node tests/v240-forge-pause.test.cjs
      - name: V241 Classic cave three layouts, visual cache and shared SOLO/MP checks
        run: node tests/v241-classic-cave.test.cjs
      - name: V242 Classic six-player world weapon visibility and retry regression
        run: node tests/v242-weapon-pickup.test.cjs
      - name: V243 revive percentage above thumb in Classic and New Zone
        run: node tests/v243-revive-progress.test.cjs
      - name: V244 blank lobby chat mobile swipe and message safety
        run: node tests/v244-empty-lobby-chat-scroll.test.cjs
      - name: Verify portrait lobby width at 320/360/393/412px on actual Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          node tests/v166-lobby-mobile-width.test.cjs
          node tests/v166-lobby-mobile-browser.test.cjs
          node tests/v220-temple-art.test.cjs
      - name: Select authenticated deploy or verify existing Cloudflare Builds integration
        id: deploy_auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'mode=wrangler' >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'mode=native' >> "$GITHUB_OUTPUT"
            echo '::notice::No Actions credentials. Cloudflare Workers Builds must deploy main independently. The exact public assets and matching relay must still pass verification; no deploy is claimed here.'
          else
            echo '::error::Incomplete Actions credentials. Configure both secrets or remove the incomplete pair and use the existing native integration.'
            exit 1
          fi
      - name: Block stale commits and version downgrades
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error title=Outdated release rejected::A newer main commit exists. No deployment."
            exit 1
          fi
          python3 - <<'PY'
          import os,re,urllib.request
          from pathlib import Path
          candidate=Path('public/index.html').read_text(encoding='utf-8')
          m=re.search(r'<title>Night Watch v(\d+)\b',candidate)
          if not m: raise SystemExit('ERROR: missing candidate version')
          release=re.search(r'<meta name="ns-release" content="(\d+)"',candidate)
          expected=max(int(m.group(1)),int(release.group(1)) if release else 0)
          url=os.environ['LIVE_URL']+'?version-preflight='+os.environ['GITHUB_SHA']
          try:
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NocturnaWorkerRelease/1.0'})
            with urllib.request.urlopen(req,timeout=25) as response:
              live=response.read(2_000_000).decode('utf-8','replace')
          except Exception as error:
            raise SystemExit('ERROR: current worker could not be checked, refusing unsafe deploy: '+str(error))
          found=[int(x) for x in re.findall(r'Night Watch v(\d+)|VERZIJA V(\d+)',live) for x in x if x]
          if not found: raise SystemExit('ERROR: no version in existing Worker; refusing unsafe deploy')
          release=re.search(r'<meta name="ns-release" content="(\d+)"',live)
          actual=max(found+[int(release.group(1))] if release else found)
          print(f'Existing Worker v{actual}; candidate v{expected}')
          if expected<actual: raise SystemExit('ERROR: refusing Worker version downgrade')
          PY
      - name: Deploy static game to SAME Cloudflare Worker
        if: steps.deploy_auth.outputs.mode == 'wrangler'
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify actual live Worker version
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,urllib.request,time
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          expected=int(re.search(r'<title>Night Watch v(\d+)\b',html).group(1))
          release=re.search(r'<meta name="ns-release" content="(\d+)"',html)
          expected_release=release.group(1) if release else None
          base=os.environ['LIVE_URL']
          for attempt in range(1,25):
            try:
              u=base+'?worker-deploy='+os.environ['GITHUB_SHA']+'-'+str(attempt)
              req=urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'NocturnaWorkerRelease/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                data=response.read(2_000_000).decode('utf-8','replace')
              m=re.search(r'<title>Night Watch v(\d+)\b',data)
              live_release=re.search(r'<meta name="ns-release" content="(\d+)"',data)
              if m and int(m.group(1))==expected and (expected_release is None or (live_release and live_release.group(1)==expected_release)):
                print(f'Verified existing workers.dev URL serves release V{expected_release or expected}')
                with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f'### Worker LIVE: release V{expected_release or expected}\n\n{base}\n')
                break
              print('Attempt',attempt,'not updated yet')
            except Exception as ex:
              print('Attempt',attempt,'error:',ex)
            time.sleep(8)
          else:
            raise SystemExit('ERROR: Worker production version mismatch; deployment NOT verified')
          PY
      - name: Verify exact deployed HTML, assets and compatible production relay (both deployment modes)
        run: node scripts/verify-live-v169-village.mjs
      - name: Report verified production deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ job.status }}
        with:
          script: |
            const ok = process.env.DEPLOY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: ok ? 'success' : 'failure',
              context: 'cloudflare/worker-production',
              description: ok ? 'Live release and game assets verified on permanent URL' : 'Production not verified; inspect deployment job log',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            })
