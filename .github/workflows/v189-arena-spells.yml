name: V189 Nova Zone magic QA
on:
  pull_request:
    branches: [main]
    paths: ['public/v140-net-mode.js','public/index.html','tests/v189-*.cjs','.github/workflows/v189-arena-spells.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spells:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node tests/v189-arena-spells.test.cjs
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - run: node tests/v189-arena-browser.test.cjs
