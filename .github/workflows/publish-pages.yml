name: Verify Noćna Straža v103 – Rotfiend Waves 20 & 30
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "addons/**"
      - "tests/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Simulated cage guards, prisoner, companion AI and solo resume
        run: node tests/v95-cage.test.cjs
      - name: Mana progression and ability balance tests
        run: node tests/v95-progression.test.cjs
      - name: Old magic, cooldown and host security regression
        run: node tests/v95-magic.test.cjs
      - name: 157 achievement and six simulated co-op player checks
        run: node tests/v95-achievements.test.cjs
      - name: Daily and weekly challenge regression
        run: node tests/v92-challenges.test.cjs
      - name: v94 economy replay and adaptive frame-rate regression
        run: node tests/v95-economy-fx.test.cjs
      - name: Verify release files and version
        run: |
          test -s public/index.html
          test -s public/firebase-config.js
          test -s public/auth-v82.js
          grep -q '<title>Night Watch v103' public/index.html
      - name: Install mobile Chromium test driver
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Mobile 360/412 screen gameplay, spell HUD and six-player packet test
        run: node tests/v95-browser.test.cjs
      - name: V97 mobile post-match scoreboard, real usernames, rematch votes and replay
        run: node tests/v97-postmatch.test.cjs
      - name: V98 cave reconnect and gameplay-only mana HUD mobile regressions
        run: node tests/v98-cave-mana.test.cjs
      - name: V99 shared pause, 3s level selection, reconnect status and votes on mobile
        run: node tests/v99-coop-votes.test.cjs
      - name: V100 unique Rotfiend event at waves 20 and 30 in mobile browser
        run: node tests/v100-rotfiend-waves.test.cjs
      - name: V101 pause messages for power and chest choice, language, timeout and multiplayer packets
        run: node tests/v101-selection-status.test.cjs
      - name: V102 public listing Join and slow-phone isolation at 360/412px
        run: node tests/v102-join-isolation.test.cjs
      - name: V103 persistent Friend IDs, duplicate contacts and one-tap group invitations on Android
        run: node tests/v103-friends-party.test.cjs
