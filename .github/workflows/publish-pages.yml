name: Verify Noćna Straža v92
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tests/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 157 solo + six-player achievements regression checks
        run: node tests/v92-achievements.test.cjs
      - name: Daily and weekly challenge checks
        run: node tests/v92-challenges.test.cjs
      - name: Verify Firebase assets and source encoding
        run: |
          test -s public/index.html
          test -s public/firebase-config.js
          test -s public/auth-v82.js
          grep -q 'Night Watch v92 — Multiplayer' public/index.html
      - name: Install browser test library
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Real mobile Chromium test, login assets, SP, lobby and six snapshots
        run: node tests/v92-browser.test.cjs
