name: Verify Noćna Straža v94 – Economy & Adaptive FX
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "addons/**"
      - "tests/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: v94 economy anti-replay, bounded purchases and adaptive FPS simulation
        run: node tests/v94-economy-fx.test.cjs
      - name: Regression - spells, mana, cooldown and host validation
        run: node tests/v94-magic.test.cjs
      - name: Regression - solo/multiplayer achievements
        run: node tests/v94-achievements.test.cjs
      - name: Regression - daily/weekly challenges
        run: node tests/v92-challenges.test.cjs
      - name: Verify v94 release assets
        run: |
          test -s public/index.html
          test -s public/auth-v82.js
          test -s public/firebase-config.js
          grep -q 'Night Watch v94' public/index.html
      - name: Install Chromium browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Real mobile browser solo, spell and six-player snapshot regression
        run: node tests/v94-browser.test.cjs
