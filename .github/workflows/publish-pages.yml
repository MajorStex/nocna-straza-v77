name: Verify Noćna Straža v91
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tests/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test v91 solo, multiplayer six-player team and item rewards
        run: node tests/v91-achievements.test.cjs
      - name: Verify Firebase assets and source encoding
        run: |
          test -s public/index.html
          test -s public/firebase-config.js
          test -s public/auth-v82.js
          grep -q 'Night Watch v91 — Multiplayer' public/index.html
