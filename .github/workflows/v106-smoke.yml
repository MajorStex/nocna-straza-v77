name: V107 compatibility smoke for earlier multiplayer features
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/auth-v82.js'
      - 'tests/v106-multiplayer-ui.test.cjs'
      - 'tests/v106-mobile-interaction.test.cjs'
      - 'tests/v105-temple.test.cjs'
      - '.github/workflows/v106-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-feature-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse inline JavaScript and verify V107 markers
        run: node tests/v106-multiplayer-ui.test.cjs
      - name: Install Chromium browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Full Temple end-to-end on two mobile screen sizes
        run: node tests/v105-temple.test.cjs
      - name: Collapsible spell HUD, upgrade label and revive heartbeat in mobile browser
        run: node tests/v106-mobile-interaction.test.cjs
