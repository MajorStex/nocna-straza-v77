name: V119 Village 60 FPS with one shared render loop
on:
  push:
    branches: [main]
    paths: ['public/index.html','public/v115-village.js','tests/v119-village-60fps.test.cjs','tests/v118-village-regression.test.cjs','tests/v116-release.test.cjs','tests/v114-gate-hud-goblin.test.cjs','.github/workflows/v119-village-fps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  village-fps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - run: node tests/v119-village-60fps.test.cjs
      - run: node tests/v118-village-regression.test.cjs
      - run: node tests/v117-village-avatar.test.cjs
      - run: node tests/v116-release.test.cjs
      - run: node tests/v114-gate-hud-goblin.test.cjs
