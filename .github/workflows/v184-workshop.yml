name: V184 guest heroes abilities and six-seat rescue QA
on:
  pull_request:
    branches: [main]
    paths: ['public/**','tests/v184-*.cjs','.github/workflows/v184-workshop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check public/v171-character-creator.js && node --check public/v177-workshop.js
      - run: node tests/v184-rescue.test.cjs
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - run: node tests/v184-workshop-abilities.test.cjs
