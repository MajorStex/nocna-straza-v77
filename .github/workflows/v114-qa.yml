name: V114 visual, gate and multiplayer regressions
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/v114/**'
      - 'public/v111-village.js'
      - 'tests/v114-*.test.cjs'
      - '.github/workflows/v114-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/v114-gate-hud-goblin.test.cjs
      - run: node tests/v114-ally.test.cjs
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2 ws@8
      - run: node tests/v114-village.test.cjs
      - run: node tests/v114-relay-e2e.test.cjs
      - run: node tests/v114-six-players.test.cjs
