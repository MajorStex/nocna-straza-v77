name: V116 main game - Village, cave, gate, goblin and multiplayer
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/v115-village.js'
      - 'public/village-test/**'
      - 'tests/v115-secret-cave.test.cjs'
      - 'tests/v116-*.test.cjs'
      - '.github/workflows/v116-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/v116-release.test.cjs
      - run: node tests/v115-secret-cave.test.cjs
      - run: node tests/v114-gate-hud-goblin.test.cjs
      - run: node tests/v114-ally.test.cjs
  village-and-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright-core@1.58.2 ws@8
      - run: node tests/v116-village.test.cjs
      - run: node tests/v116-six-players.test.cjs
