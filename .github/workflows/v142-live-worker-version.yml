name: Noćna Straža V142 — read-only live version verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v142-live-worker-version.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read actual Worker release without deploying
        run: |
          python3 - <<'PY'
          import re,urllib.request
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          wanted=re.search(r'<title>Night Watch v(\d+)',html).group(1)
          url='https://nocna-straza-v77.stefanstevic1996.workers.dev/?live-v142-check='+wanted
          request=urllib.request.Request(url,headers={'User-Agent':'NightWatch-LiveProbe/142','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=25) as response:
              live=response.read(2000000).decode('utf-8','replace')
              found=re.search(r'<title>Night Watch v(\d+)',live)
              print('HTTP:',response.status)
              print('GITHUB_VERSION:',wanted)
              print('LIVE_VERSION:',found.group(1) if found else 'UNKNOWN')
              if not found or found.group(1)!=wanted:
                  raise SystemExit('NOT LIVE: Cloudflare Worker has not deployed the repository version')
          print('VERIFIED: GitHub version is live at the EXISTING Worker URL')
          PY
