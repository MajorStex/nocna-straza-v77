name: Live Noćna Straža v98 – Cave Disconnect & Mana
on:
  push:
    branches: [main]
    paths:
      - "tests/v98-live-disconnect.test.cjs"
      - ".github/workflows/v98-live-disconnect.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Two mobile browser peers, one disconnect, solo cave and clean mana HUD
        run: node tests/v98-live-disconnect.test.cjs
