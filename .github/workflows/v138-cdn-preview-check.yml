name: Verify V138 standalone playable preview URLs
on:
  push:
    branches: [probe/v138-live-preview]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test publicly reachable exact V138 HTML and assets
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          sha='e9eb8165f9b6a9363f66b0501f5300bf02d1f025'
          origins=[
            'https://raw.githack.com/MajorStex/nocna-straza-v77/'+sha+'/public/',
            'https://rawcdn.githack.com/MajorStex/nocna-straza-v77/'+sha+'/public/',
            'https://cdn.jsdelivr.net/gh/MajorStex/nocna-straza-v77@'+sha+'/public/',
          ]
          good=[]
          for origin in origins:
            try:
              req=urllib.request.Request(origin+'index.html',headers={'User-Agent':'Mozilla/5.0 NightWatch-V138-Preview-Check'})
              with urllib.request.urlopen(req,timeout=23) as r:
                body=r.read(1200000).decode('utf8','replace')
                mime=r.headers.get('content-type','')
                print('PREVIEW_URL',origin+'index.html','status',r.status,'type',mime,'length',len(body),flush=True)
              req2=urllib.request.Request(origin+'v115-village.js',headers={'User-Agent':'Mozilla/5.0 NightWatch-V138-Preview-Check'})
              with urllib.request.urlopen(req2,timeout=23) as r:
                code=r.read(200000).decode('utf8','replace')
                print('ASSET_URL',origin+'v115-village.js','status',r.status,'length',len(code),flush=True)
              if '<title>Night Watch v138' in body and 'VILLAGE_W=1660,VILLAGE_H=960' in code and 'text/html' in mime.lower():
                good.append(origin+'index.html')
            except Exception as e:
              print('PREVIEW_FAILED',origin,repr(e),flush=True)
          print('VALID_V138_PREVIEW_URLS',good,flush=True)
          if not good: raise SystemExit('No confirmed browser-served preview URL')
          PY
      - name: Mobile Chromium loads the full game and expanded Village from CDN
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.58.2
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
           const sha='e9eb8165f9b6a9363f66b0501f5300bf02d1f025';
           const url='https://rawcdn.githack.com/MajorStex/nocna-straza-v77/'+sha+'/public/index.html';
           const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',
             args:['--no-sandbox','--disable-dev-shm-usage']});
           try{
            for (const width of [360,412]){
             const page=await browser.newPage({viewport:{width,height:844},isMobile:true,hasTouch:true});
             const errors=[], failedRequests=[], consoleMessages=[];
             page.on('pageerror',e=>errors.push(e.message));
             page.on('requestfailed',r=>failedRequests.push(r.url().slice(0,220)+' '+r.failure()?.errorText));
             page.on('console',m=>{if(m.type()==='error')consoleMessages.push(m.text().slice(0,220))});
             const res=await page.goto(url+'?village-test=1&lang=sr',{waitUntil:'domcontentloaded',timeout:28000});
             if((await page.title()).includes('External Content Notice')){
               console.log('CDN_NOTICE_FORM_COUNT',await page.locator('form').count());
               console.log('CDN_NOTICE_BUTTONS',await page.locator('button,input[type=submit]').allTextContents());
               if(await page.locator('form').count()){
                await Promise.all([
                 page.waitForLoadState('domcontentloaded',{timeout:18000}).catch(()=>{}),
                 page.locator('form').first().evaluate(el=>el.submit())
                ]);
               }
             }
             try{await page.waitForFunction(()=>window.__VILLAGE_PREVIEW_STATUS?.open===true,{timeout:17000})}
             catch(e){console.log('CDN_WAIT_TIMEOUT',String(e))}
             const state=await page.evaluate(()=>({
               title:document.title,
               version:document.querySelector('#ns129VersionBadge')?.textContent,
               game:!!window.__nightWatch,
               villageJs:!!window.NS109_VILLAGE,
               previewStatus:window.__VILLAGE_PREVIEW_STATUS,
               world:window.NS109_VILLAGE?.test?.world,
               buildings:window.NS109_VILLAGE?.test?.buildings?.length,
               animals:window.NS109_VILLAGE?.test?.animals?.length,
               villageVisible:!document.querySelector('#ns109Village')?.classList.contains('ns109Hidden'),
               content:document.body.innerText.slice(0,200)
             }));
             console.log('LIVE_CDN_V138_BROWSER',width,'status',res.status(),JSON.stringify(state),'errors',JSON.stringify(errors),'failedRequests',JSON.stringify(failedRequests),'console',JSON.stringify(consoleMessages));
             if(res.status()!==200||state.version!=='v138'||state.world?.width!==1660||
                state.buildings!==9||state.animals!==12||!state.villageVisible||
                errors.some(e=>/SyntaxError|TypeError|ReferenceError|RangeError/.test(e)))throw Error('Live V138 browser smoke failed');
             await page.close();
            }
           } finally { await browser.close() }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
