name: V108 mobile HUD and copyright QA
on:
  push:
    branches: [main]
    paths: ['public/index.html','tests/v108-ui-rights.test.cjs','tests/v135-werewolves-browser.test.cjs','tests/v136-wave40-link.test.cjs','tests/v137-wolf-appearance-audio.test.cjs','tests/v138-village-pvp-animals.test.cjs','.github/workflows/v108-ui-rights.yml']
  pull_request:
    branches: [main]
    paths: ['public/index.html','public/v115-village.js','tests/v138-village-pvp-animals.test.cjs','.github/workflows/v108-ui-rights.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: UI overlap geometry and anti-copy metadata
        run: node tests/v108-ui-rights.test.cjs

      - name: V135 actual mobile browser wave-40 werewolf smoke
        run: node tests/v135-werewolves-browser.test.cjs
      - name: V137 direct wave-39 preview and actual wave-40 transition
        run: node tests/v136-wave40-link.test.cjs
      - name: V137 real wolf recording and reversible visuals
        run: node tests/v137-wolf-appearance-audio.test.cjs
      - name: V138 enlarged village and combat mobile QA
        run: node tests/v138-village-pvp-animals.test.cjs
