name: V156 mobile horde depth sorting and audio QA
on:
  push:
    branches: [main]
    paths:
      - 'public/v140-net-mode.js'
      - 'public/v154-goblin-renderer.js'
      - 'public/v152-arena-audio.js'
      - 'public/index.html'
      - 'tests/v156-depth-audio.test.cjs'
      - '.github/workflows/v156-depth-audio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  depth-and-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile Chromium test dependency
        run: npm install --no-save --no-package-lock playwright-core@1.58.2
      - name: Validate player behind/in front of horde and bound audio voices
        run: |
          node --check public/v140-net-mode.js
          node --check public/v154-goblin-renderer.js
          node --check public/v152-arena-audio.js
          node tests/current-deployment.test.cjs
          node tests/v156-depth-audio.test.cjs
      - name: Regression checks for 80 goblins and multiplayer looks
        run: |
          node tests/v140-isolated-arena.test.cjs
          node tests/v151-mob-motion.test.cjs
          node tests/v153-looks.test.cjs
          node tests/v154-goblins.test.cjs
          node tests/v155-colors-lobby-transfer.test.cjs
          node tests/v155-appearance-browser.test.cjs
