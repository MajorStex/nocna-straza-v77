name: Verify actual V140 live on permanent Worker and relay
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v140-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public Workers.dev release, assets and arena route
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          game='https://nocna-straza-v77.stefanstevic1996.workers.dev/'
          relay='https://nocna-straza-relay.stefanstevic1996.workers.dev'
          def get(url,timeout=25):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NightWatch-V140-live-verify/1.0'})
            with urllib.request.urlopen(req,timeout=timeout) as response:
              return response.read(2000000).decode('utf-8','replace')
          ready=False
          for i in range(1,10):
            try:
              html=get(game+'?release=140&attempt='+str(i))
              js=get(game+'v140-net-mode.js?release=140')
              ready=('<title>Night Watch v140 —' in html and
                     'VERZIJA V140' in html and
                     'NS140_ARENA' in js and
                     'SINGLEPLAYER' in html and
                     'MULTIPLAYER' in html)
              print('LIVE VERSION attempt',i,'v140=',ready,'bytes=',len(html),flush=True)
              if ready:break
            except Exception as ex:print('GAME probe',i,str(ex),flush=True)
            time.sleep(10)
          if not ready:raise SystemExit('GAME V140 NOT LIVE at original Worker URL')
          health=json.loads(get(relay+'/health'))
          if health.get('ok') is not True:raise SystemExit('Legacy relay health unavailable')
          req=urllib.request.Request(relay+'/arena/create',method='POST',data=json.dumps({'code':'BAD','seats':['p1']}).encode('utf-8'),headers={'Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=20) as res:
              raise SystemExit('Invalid arena request was unexpectedly accepted: '+str(res.status))
          except urllib.error.HTTPError as err:
            body=err.read(10000).decode('utf-8','replace')
            print('ARENA invalid-roster probe',err.code,body,flush=True)
            if err.code!=400 or 'invalid_roster' not in body:raise SystemExit('New arena backend was NOT deployed correctly')
          print('SUCCESS: V140 frontend on permanent workers.dev, same legacy relay healthy, new /arena route installed')
          PY
