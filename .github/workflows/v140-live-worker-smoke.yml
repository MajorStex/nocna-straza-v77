name: Verify live game Worker, Village and arena backend
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/v140-live-worker-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v140-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Workers.dev release, assets and arena route
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error,re
          from pathlib import Path
          game='https://nocna-straza-v77.stefanstevic1996.workers.dev/'
          relay='https://nocna-straza-relay.stefanstevic1996.workers.dev'
          def get(url,timeout=25):
            req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'NightWatch-V140-live-verify/1.0'})
            with urllib.request.urlopen(req,timeout=timeout) as response:
              return response.read(2000000).decode('utf-8','replace')
          expected=re.search(r'<title>Night Watch v(\d+)\b',Path('public/index.html').read_text(encoding='utf-8')).group(1)
          ready=False
          for i in range(1,10):
            try:
              html=get(game+'?release=140&attempt='+str(i))
              js=get(game+'v140-net-mode.js?release=140')
              village=get(game+'v115-village.js?release='+expected)
              ready=(('<title>Night Watch v'+expected+' —') in html and
                     ('VERZIJA V'+expected) in html and
                     'NS140_ARENA' in js and
                     'ns141Server' in village and
                     'ns141Training' in village and
                     'SINGLEPLAYER' in html and
                     'MULTIPLAYER' in html)
              print('LIVE VERSION attempt',i,'build='+expected, 'ok=',ready,'bytes=',len(html),flush=True)
              if ready:break
            except Exception as ex:print('GAME probe',i,str(ex),flush=True)
            time.sleep(10)
          if not ready:raise SystemExit('Expected Village release NOT LIVE at original Worker URL')
          health=json.loads(get(relay+'/health'))
          if health.get('ok') is not True:raise SystemExit('Legacy relay health unavailable')
          req=urllib.request.Request(relay+'/arena/create',method='POST',data=json.dumps({'code':'BAD','seats':['p1']}).encode('utf-8'),headers={'Content-Type':'application/json','Origin':game.rstrip('/'),'Accept':'application/json','User-Agent':'Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Mobile Safari/537.36'})
          try:
            with urllib.request.urlopen(req,timeout=20) as res:
              raise SystemExit('Invalid arena request was unexpectedly accepted: '+str(res.status))
          except urllib.error.HTTPError as err:
            body=err.read(10000).decode('utf-8','replace')
            print('ARENA invalid-roster probe',err.code,body,flush=True)
            if err.code!=400 or 'invalid_roster' not in body:raise SystemExit('New arena backend was NOT deployed correctly')
          # Exercise actual SQLite Durable Object bindings once. This reserves one of
          # the 20 daily free-tier V140 test rooms, but does not start a match.
          payload=json.dumps({'code':'TSTABC','seats':['p1','p2']}).encode('utf-8')
          valid=urllib.request.Request(relay+'/arena/create',method='POST',data=payload,headers={'Content-Type':'application/json','Origin':game.rstrip('/'),'Accept':'application/json','User-Agent':'Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Mobile Safari/537.36'})
          try:
            with urllib.request.urlopen(valid,timeout=25) as res:
              room=json.loads(res.read(5000))
          except urllib.error.HTTPError as err:
            raise SystemExit('Arena room creation failed: HTTP '+str(err.code)+' '+err.read(700).decode('utf-8','replace'))
          if not (room.get('ok') and room.get('protocol')==140 and
                  isinstance(room.get('match'),str) and len(room['match'])==24 and
                  isinstance(room.get('tickets'),dict) and
                  all(len(room['tickets'].get(s,''))==48 for s in ['p1','p2'])):
            raise SystemExit('Arena room creation returned invalid ticket or protocol data')
          print('SUCCESS: V140 two-seat server test room successfully prepared; tickets validated; no actual game started')
          print('SUCCESS: game frontend, Village, legacy relay and new arena live on permanent workers.dev')
          PY
